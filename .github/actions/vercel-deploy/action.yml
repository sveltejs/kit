name: 'Vercel Deploy'
description: 'Deploy a prebuilt test app to Vercel'

inputs:
  variant:
    description: 'Name of the test app variant'
    required: true
  # Important: When setting up a new Vercel test app, make sure
  # to set the root directory in the dashboard to the correct path.
  vercel-project-id:
    description: 'Vercel project ID for the test app'
    required: true
  vercel-token:
    description: 'Vercel authentication token'
    required: true
  vercel-org-id:
    description: 'Vercel organization ID'
    required: true
  purge-cache:
    description: 'Purge the Vercel CDN cache before testing'
    required: false
    default: 'false'
outputs:
  deployment-url:
    description: 'URL of the deployed preview'
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: 'composite'
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-vercel-${{ inputs.variant }}-${{ github.run_id }}
        path: ${{ runner.temp }}/platform-output

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        working-directory: .workflow # where the pnpm-lock.yaml file lives
        version: ^12.0.0
        runtime: node@24
        cache: true

    - name: Install Vercel CLI
      shell: bash
      run: pnpm i -g vercel

    - name: Deploy to Vercel
      id: deploy
      shell: bash
      working-directory: ${{ runner.temp }}/platform-output
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: echo "url=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

    # avoid stale cache results when testing ISR routes
    - name: Purge Vercel CDN Cache
      if: inputs.purge-cache == 'true'
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: vercel cache purge --type cdn --token="$VERCEL_TOKEN" --yes

    - name: Save deployment URL
      shell: bash
      env:
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
      run: |
        mkdir "${{ runner.temp }}/deployment"
        printf '%s' "$DEPLOYMENT_URL" > "${{ runner.temp }}/deployment/url"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-vercel-${{ inputs.variant }}-deployment-${{ github.run_id }}
        path: ${{ runner.temp }}/deployment/url
        if-no-files-found: error
        retention-days: 1

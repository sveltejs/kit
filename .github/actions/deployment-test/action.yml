name: 'Platform Test'
description: 'Run platform tests against a deployed test app'

inputs:
  sha:
    description: 'Commit SHA to test'
    required: true
  platform:
    description: 'Name of the deployment platform'
    required: true
  test-app-dir:
    description: 'Path to the test app directory'
    required: true
  variant:
    description: 'Name of the test app variant'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.sha }}
        persist-credentials: false
        path: .target

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@24
        working-directory: .target

    - name: Install Playwright
      shell: bash
      working-directory: .target
      run: pnpm playwright install chromium --no-shell

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-${{ inputs.platform }}-${{ inputs.variant }}-deployment-${{ github.run_id }}
        path: ${{ runner.temp }}/deployment

    - name: Read deployment URL
      id: deployment
      shell: bash
      run: echo "url=$(cat '${{ runner.temp }}/deployment/url')" >> "$GITHUB_OUTPUT"

    - name: Run Playwright tests
      shell: bash
      working-directory: .target/${{ inputs.test-app-dir }}
      env:
        DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
      run: pnpm test:platform

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-test-results-${{ inputs.platform }}-${{ inputs.variant }}
        path: .target/${{ inputs.test-app-dir }}/test-results
        retention-days: 3

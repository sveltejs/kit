name: 'Node Setup'
description: 'Set up the repo and run it on Node.js'

inputs:
  node-version:
    description: 'The Node version to install'
    required: true
    default: '24'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true

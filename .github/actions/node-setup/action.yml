name: 'Node Setup'
description: 'Set up the repo and run it on Node.js'

inputs:
  node-version:
    description: 'The Node version to install'
    required: true
    default: '24'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true

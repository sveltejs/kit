name: 'Netlify Deploy'
description: 'Deploy a prebuilt test app to Netlify'

inputs:
  netlify-project-id:
    description: 'Netlify project ID'
    required: true
  netlify-token:
    description: 'Netlify authentication token'
    required: true
outputs:
  deployment-url:
    description: 'URL of the deployed preview'
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: 'composite'
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: platform-netlify-${{ env.VARIANT }}-${{ github.run_id }}
        path: ${{ runner.temp }}/platform-output

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@24
        cache: true

    - name: Install Netlify CLI
      shell: bash
      run: pnpm i -g netlify-cli

    - name: Deploy to Netlify
      id: deploy
      shell: bash
      working-directory: ${{ runner.temp }}/platform-output
      env:
        NETLIFY_AUTH_TOKEN: ${{ inputs.netlify-token }}
        NETLIFY_PROJECT_ID: ${{ inputs.netlify-project-id }}
      run: |
        set -euo pipefail

        if deploy_json=$(netlify deploy \
          --json \
          --no-build \
          --dir="build" \
          --functions=".netlify/v1/functions" \
          --auth="$NETLIFY_AUTH_TOKEN" \
          --site="$NETLIFY_PROJECT_ID"
        ); then
          deploy_url=$(jq -er '.deploy_url' <<< "$deploy_json")
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Netlify deployment failed"
          echo "$deploy_json" >&2
          exit 1
        fi

    - name: Save deployment URL
      shell: bash
      env:
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
      run: |
        mkdir "${{ runner.temp }}/deployment"
        printf '%s' "$DEPLOYMENT_URL" > "${{ runner.temp }}/deployment/url"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-netlify-${{ env.VARIANT }}-deployment-${{ github.run_id }}
        path: ${{ runner.temp }}/deployment/url
        if-no-files-found: error
        retention-days: 1

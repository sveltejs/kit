name: 'Netlify Build'
description: 'Build a Netlify test app and upload its deployment artifact'

inputs:
  sha:
    description: 'Commit SHA to build'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.sha }}
        persist-credentials: false
        path: .target

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@24
        working-directory: .target

    - name: Build test app
      shell: bash
      working-directory: .target/${{ env.TEST_APP_DIR }}
      run: pnpm build

    - name: Stage deployment artifact
      shell: bash
      env:
        TARGET_DIR: ${{ github.workspace }}/.target/${{ env.TEST_APP_DIR }}
      run: |
        mkdir platform-output
        cp -a "$TARGET_DIR/build" "$TARGET_DIR/.netlify" platform-output/

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: platform-netlify-${{ env.VARIANT }}-${{ github.run_id }}
        path: platform-output
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

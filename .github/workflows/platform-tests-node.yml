name: Platform Tests (Node)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test-basic:
    if: github.repository == 'sveltejs/kit'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - node-version: 22
            os: ubuntu-latest
          - node-version: 24
            os: ubuntu-latest
          - node-version: 24
            os: windows-latest
    environment: '@sveltejs/adapter-node platform tests'
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build adapter-node files
        working-directory: packages/adapter-node
        run: pnpm prepublishOnly

      - uses: ./.github/actions/platform-test
        with:
          test-app-dir: packages/adapter-node/test/apps/basic

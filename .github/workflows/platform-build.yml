name: Platform Build

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to build'
        required: true
        type: string
      platform:
        description: 'Deployment platform (vercel or netlify)'
        required: true
        type: string
      test-app-dir:
        description: 'Path to the test app directory'
        required: true
        type: string
      artifact-name:
        description: 'Name of the deployment artifact'
        required: true
        type: string
      edge:
        description: 'Build the Netlify edge variant'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24

      - name: Build test app
        working-directory: ${{ inputs.test-app-dir }}
        env:
          EDGE: ${{ inputs.edge }}
        run: pnpm build

      - name: Stage deployment artifact
        env:
          PLATFORM: ${{ inputs.platform }}
          TEST_APP_DIR: ${{ inputs.test-app-dir }}
        run: |
          set -euo pipefail
          mkdir platform-output

          case "$PLATFORM" in
            vercel)
              cp -a "$TEST_APP_DIR/.vercel" platform-output/
              ;;
            netlify)
              cp -a "$TEST_APP_DIR/build" "$TEST_APP_DIR/.netlify" platform-output/
              ;;
            *)
              echo "::error::Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: platform-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

name: Platform Test (Netlify)

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      variant:
        description: 'Name of the test app variant'
        required: true
        type: string
      test-app-dir:
        description: 'Path to the test app directory'
        required: true
        type: string
      edge:
        description: 'Build the test app with Netlify Edge Functions'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24

      - name: Build adapter
        run: pnpm --filter @sveltejs/adapter-netlify build

      - name: Build test app
        working-directory: ${{ inputs.test-app-dir }}
        env:
          EDGE: ${{ inputs.edge }}
        run: pnpm build

      - name: Stage deployment artifact
        env:
          TARGET_DIR: ${{ github.workspace }}/${{ inputs.test-app-dir }}
        run: |
          mkdir platform-output
          cp -a "$TARGET_DIR/build" "$TARGET_DIR/.netlify" platform-output/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-netlify-${{ inputs.variant }}-${{ github.run_id }}
          path: platform-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'sveltejs/kit'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            pnpm-lock.yaml
          path: .workflow
      - uses: ./.workflow/.github/actions/netlify-deploy
        with:
          netlify-project-id: ${{ inputs.variant == 'basic' && secrets.NETLIFY_PROJECT_ID_BASIC || inputs.variant == 'edge' && secrets.NETLIFY_PROJECT_ID_EDGE || inputs.variant == 'instrumentation' && secrets.NETLIFY_PROJECT_ID_INSTRUMENTATION || secrets.NETLIFY_PROJECT_ID_SPLIT }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
          variant: ${{ inputs.variant }}

  test:
    if: github.repository == 'sveltejs/kit'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            pnpm-lock.yaml
          path: .workflow
      - uses: ./.workflow/.github/actions/deployment-test
        with:
          sha: ${{ inputs.sha }}
          platform: netlify
          test-app-dir: ${{ inputs.test-app-dir }}
          variant: ${{ inputs.variant }}

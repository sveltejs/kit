name: Platform Test (Netlify)

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      name:
        description: 'Name of the test variant'
        required: true
        type: string
      test-app-dir:
        description: 'Path to the test app directory'
        required: true
        type: string
      edge:
        description: 'Build the edge variant'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDGE: ${{ inputs.edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24

      - name: Build test app
        working-directory: ${{ inputs.test-app-dir }}
        run: pnpm build

      - name: Stage deployment artifact
        env:
          TEST_APP_DIR: ${{ inputs.test-app-dir }}
        run: |
          mkdir platform-output
          cp -a "$TEST_APP_DIR/build" "$TEST_APP_DIR/.netlify" platform-output/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-netlify-${{ inputs.name }}-${{ github.run_id }}
          path: platform-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'sveltejs/kit'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            pnpm-lock.yaml
          path: .workflow

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-netlify-${{ inputs.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-output

      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ inputs.name == 'basic' && secrets.NETLIFY_PROJECT_ID_BASIC || inputs.name == 'edge' && secrets.NETLIFY_PROJECT_ID_EDGE || inputs.name == 'instrumentation' && secrets.NETLIFY_PROJECT_ID_INSTRUMENTATION || secrets.NETLIFY_PROJECT_ID_SPLIT }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}

      - name: Save deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          mkdir "${{ runner.temp }}/deployment"
          printf '%s' "$DEPLOYMENT_URL" > "${{ runner.temp }}/deployment/url"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-netlify-${{ inputs.name }}-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment/url
          if-no-files-found: error
          retention-days: 1

  test:
    if: github.repository == 'sveltejs/kit'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-netlify-${{ inputs.name }}-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment

      - name: Read deployment URL
        id: deployment
        run: echo "url=$(cat '${{ runner.temp }}/deployment/url')" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        working-directory: ${{ inputs.test-app-dir }}
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: pnpm test:platform

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-test-results-netlify-${{ inputs.name }}
          path: ${{ inputs.test-app-dir }}/test-results
          retention-days: 3

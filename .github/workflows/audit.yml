name: audit

on:
  schedule:
    - cron: '0 5 * * *' # daily 5AM

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  Audit:
    # prevents this action from running on forks
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the audit reads the lockfile; nothing needs installing
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      # check prod dependencies as these would affect users
      - run: pnpm audit --prod

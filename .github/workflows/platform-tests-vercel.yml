name: Platform Tests (Vercel)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  basic:
    uses: ./.github/workflows/platform-test-vercel.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      name: basic
      test-app-dir: packages/adapter-vercel/test/apps/basic
      purge-cache: true

  split:
    uses: ./.github/workflows/platform-test-vercel.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      name: split
      test-app-dir: packages/adapter-vercel/test/apps/split

name: Platform Tests (Netlify)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  basic:
    if: github.repository == 'sveltejs/kit'
    uses: ./.github/workflows/platform-test-netlify.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      variant: basic
      test-app-dir: packages/adapter-netlify/test/apps/basic
    secrets: inherit

  edge:
    if: github.repository == 'sveltejs/kit'
    uses: ./.github/workflows/platform-test-netlify.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      variant: edge
      test-app-dir: packages/adapter-netlify/test/apps/edge
    secrets: inherit

  split:
    if: github.repository == 'sveltejs/kit'
    uses: ./.github/workflows/platform-test-netlify.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      variant: split
      test-app-dir: packages/adapter-netlify/test/apps/split
    secrets: inherit

  split-edge:
    if: github.repository == 'sveltejs/kit'
    uses: ./.github/workflows/platform-test-netlify.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      variant: split-edge
      test-app-dir: packages/adapter-netlify/test/apps/split
      edge: true
    secrets: inherit

name: Platform Tests (Netlify)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: &variants
        include:
          - name: basic
            test-app-dir: packages/adapter-netlify/test/apps/basic
            edge: false
          - name: edge
            test-app-dir: packages/adapter-netlify/test/apps/edge
            edge: false
          - name: instrumentation
            test-app-dir: packages/adapter-netlify/test/apps/instrumentation
            edge: false
          - name: split
            test-app-dir: packages/adapter-netlify/test/apps/split
            edge: false
          - name: split-edge
            test-app-dir: packages/adapter-netlify/test/apps/split
            edge: true
    uses: ./.github/workflows/platform-build.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      platform: netlify
      test-app-dir: ${{ matrix.test-app-dir }}
      artifact-name: platform-netlify-${{ matrix.name }}-${{ github.run_id }}
      edge: ${{ matrix.edge }}

  deploy-basic:
    if: always() && github.repository == 'sveltejs/kit'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: basic
    steps:
      - &deploy-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            pnpm-lock.yaml
          path: .workflow

      - &download-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-netlify-${{ env.VARIANT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-output

      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_BASIC }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}

      - &save-deployment-url
        name: Save deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          mkdir "${{ runner.temp }}/deployment"
          printf '%s' "$DEPLOYMENT_URL" > "${{ runner.temp }}/deployment/url"

      - &upload-deployment-url
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-netlify-${{ env.VARIANT }}-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment/url
          if-no-files-found: error
          retention-days: 1

  deploy-edge:
    if: always() && github.repository == 'sveltejs/kit'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: edge
    steps:
      - *deploy-checkout
      - *download-build
      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_EDGE }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
      - *save-deployment-url
      - *upload-deployment-url

  deploy-instrumentation:
    if: always() && github.repository == 'sveltejs/kit'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: instrumentation
    steps:
      - *deploy-checkout
      - *download-build
      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_INSTRUMENTATION }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
      - *save-deployment-url
      - *upload-deployment-url

  deploy-split:
    if: always() && github.repository == 'sveltejs/kit'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        name: [split, split-edge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: ${{ matrix.name }}
    steps:
      - *deploy-checkout
      - *download-build
      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_SPLIT }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
      - *save-deployment-url
      - *upload-deployment-url

  test:
    if: always()
    needs: [deploy-basic, deploy-edge, deploy-instrumentation, deploy-split]
    strategy:
      fail-fast: false
      matrix: *variants
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      test-app-dir: ${{ matrix.test-app-dir }}
      deployment-artifact-name: platform-netlify-${{ matrix.name }}-deployment-${{ github.run_id }}
      artifact-name: platform-test-results-netlify-${{ matrix.name }}

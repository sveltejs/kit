name: Platform Tests (Netlify)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        default: ''
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build-basic:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_APP_DIR: packages/adapter-netlify/test/apps/basic
      VARIANT: basic
      EDGE: false
    steps:
      - &build-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - &build-setup
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24

      - &build-app
        name: Build test app
        working-directory: ${{ env.TEST_APP_DIR }}
        run: pnpm build

      - &stage-build
        name: Stage deployment artifact
        run: |
          mkdir platform-output
          cp -a "$TEST_APP_DIR/build" "$TEST_APP_DIR/.netlify" platform-output/

      - &upload-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-netlify-${{ env.VARIANT }}-${{ github.run_id }}
          path: platform-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-edge:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_APP_DIR: packages/adapter-netlify/test/apps/edge
      VARIANT: edge
      EDGE: false
    steps: &build-steps
      - *build-checkout
      - *build-setup
      - *build-app
      - *stage-build
      - *upload-build

  build-instrumentation:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_APP_DIR: packages/adapter-netlify/test/apps/instrumentation
      VARIANT: instrumentation
      EDGE: false
    steps: *build-steps

  build-split:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_APP_DIR: packages/adapter-netlify/test/apps/split
      VARIANT: split
      EDGE: false
    steps: *build-steps

  build-split-edge:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_APP_DIR: packages/adapter-netlify/test/apps/split
      VARIANT: split-edge
      EDGE: true
    steps: *build-steps

  deploy-basic:
    if: github.repository == 'sveltejs/kit'
    needs: build-basic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: basic
    steps:
      - &deploy-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            pnpm-lock.yaml
          path: .workflow

      - &download-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-netlify-${{ env.VARIANT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-output

      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_BASIC }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}

      - &save-deployment-url
        name: Save deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          mkdir "${{ runner.temp }}/deployment"
          printf '%s' "$DEPLOYMENT_URL" > "${{ runner.temp }}/deployment/url"

      - &upload-deployment-url
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-netlify-${{ env.VARIANT }}-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment/url
          if-no-files-found: error
          retention-days: 1

  deploy-edge:
    if: github.repository == 'sveltejs/kit'
    needs: build-edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: edge
    steps:
      - *deploy-checkout
      - *download-build
      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_EDGE }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
      - *save-deployment-url
      - *upload-deployment-url

  deploy-instrumentation:
    if: github.repository == 'sveltejs/kit'
    needs: build-instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: instrumentation
    steps:
      - *deploy-checkout
      - *download-build
      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_INSTRUMENTATION }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
      - *save-deployment-url
      - *upload-deployment-url

  deploy-split:
    if: github.repository == 'sveltejs/kit'
    needs: build-split
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: split
    steps: &deploy-split-steps
      - *deploy-checkout
      - *download-build
      - uses: ./.workflow/.github/actions/netlify-deploy
        id: deploy
        with:
          artifact-dir: ${{ runner.temp }}/platform-output
          netlify-project-id: ${{ secrets.NETLIFY_PROJECT_ID_SPLIT }}
          netlify-token: ${{ secrets.NETLIFY_TOKEN }}
      - *save-deployment-url
      - *upload-deployment-url

  deploy-split-edge:
    if: github.repository == 'sveltejs/kit'
    needs: build-split-edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: '@sveltejs/adapter-netlify platform tests'
    env:
      VARIANT: split-edge
    steps: *deploy-split-steps

  test-basic:
    needs: deploy-basic
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      test-app-dir: packages/adapter-netlify/test/apps/basic
      deployment-artifact-name: platform-netlify-basic-deployment-${{ github.run_id }}
      artifact-name: platform-test-results-netlify-basic

  test-edge:
    needs: deploy-edge
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      test-app-dir: packages/adapter-netlify/test/apps/edge
      deployment-artifact-name: platform-netlify-edge-deployment-${{ github.run_id }}
      artifact-name: platform-test-results-netlify-edge

  test-instrumentation:
    needs: deploy-instrumentation
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      test-app-dir: packages/adapter-netlify/test/apps/instrumentation
      deployment-artifact-name: platform-netlify-instrumentation-deployment-${{ github.run_id }}
      artifact-name: platform-test-results-netlify-instrumentation

  test-split:
    needs: deploy-split
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      test-app-dir: packages/adapter-netlify/test/apps/split
      deployment-artifact-name: platform-netlify-split-deployment-${{ github.run_id }}
      artifact-name: platform-test-results-netlify-split

  test-split-edge:
    needs: deploy-split-edge
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      test-app-dir: packages/adapter-netlify/test/apps/split
      deployment-artifact-name: platform-netlify-split-edge-deployment-${{ github.run_id }}
      artifact-name: platform-test-results-netlify-split-edge

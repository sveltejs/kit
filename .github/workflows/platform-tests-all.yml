name: Platform Tests (All)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test and update check status on'
        required: false
        default: ''
      platform:
        description: 'Platform to test'
        type: choice
        options: [all, netlify, vercel, node, bun]
        default: all

permissions:
  contents: read # to fetch code (actions/checkout); `{}` would strip it from the called workflows too

defaults:
  run:
    shell: bash

jobs:
  netlify:
    name: netlify / ${{ matrix.variant }}
    if: github.repository == 'sveltejs/kit' && (inputs.platform == 'all' || inputs.platform == 'netlify')
    strategy:
      fail-fast: false
      matrix:
        variant: [basic, edge, instrumentation, split]
        include:
          - variant: split-edge
            app: split
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      platform: netlify
      variant: ${{ matrix.variant }}
      app: ${{ matrix.app || matrix.variant }}
    # the secrets of a job's environment only resolve in a called workflow when the caller passes `secrets`
    secrets: inherit

  vercel:
    name: vercel / ${{ matrix.variant }}
    if: github.repository == 'sveltejs/kit' && (inputs.platform == 'all' || inputs.platform == 'vercel')
    strategy:
      fail-fast: false
      matrix:
        variant: [basic, split]
    uses: ./.github/workflows/platform-test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      platform: vercel
      variant: ${{ matrix.variant }}
      app: ${{ matrix.variant }}
    secrets: inherit

  node:
    name: node / ${{ matrix.node-version }} / ${{ matrix.os }}
    if: github.repository == 'sveltejs/kit' && (inputs.platform == 'all' || inputs.platform == 'node')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: 22, os: ubuntu-latest }
          - { node-version: 24, os: ubuntu-latest }
          - { node-version: 24, os: windows-latest }
    environment: '@sveltejs/adapter-node platform tests'
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      APP: packages/adapter-node/test/apps/basic
    steps:
      - run: git config --global core.autocrlf false

      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node-version }}

      - &install-playwright
        name: Install Playwright
        run: pnpm playwright install chromium --no-shell

      - &test
        name: Run Playwright tests
        working-directory: ${{ env.APP }}
        run: pnpm test:platform

      - &upload-test-results
        name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ env.APP }}/test-results
          retention-days: 3

  bun:
    if: github.repository == 'sveltejs/kit' && (inputs.platform == 'all' || inputs.platform == 'bun')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      APP: packages/adapter-bun/test/apps/basic
    steps:
      - *checkout

      - uses: ./.github/actions/node-setup

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - *install-playwright
      - *test

      - name: Test compiled executable
        working-directory: ${{ env.APP }}
        env:
          COMPILE: 'true'
        run: pnpm test:platform

      - name: Compile optimized cross-target executable
        working-directory: ${{ env.APP }}
        env:
          ADVANCED_COMPILE: 'true'
          COMPILE_TARGET: 'bun-linux-x64'
        run: |
          bun run --bun build
          test -x build/advanced-app

      - *upload-test-results

  report-status:
    if: always() && github.repository == 'sveltejs/kit' && inputs.platform == 'all'
    needs: [netlify, vercel, node, bun]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the repository_dispatch event
    steps:
      - name: Report results
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$CONCLUSION" in
            failure)
              title='Platform tests failed'
              summary="One or more platform test jobs failed. See the [workflow run]($RUN_URL) for details."
              ;;
            cancelled)
              title='Platform tests cancelled'
              summary='Platform tests were cancelled before completing.'
              ;;
            success)
              title='Platform tests passed'
              summary='All platform test jobs passed.'
              ;;
          esac

          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=platform-tests-result \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[conclusion]=$CONCLUSION" \
            -f "client_payload[title]=$title" \
            -f "client_payload[summary]=$summary" \
            -f "client_payload[details_url]=$RUN_URL"

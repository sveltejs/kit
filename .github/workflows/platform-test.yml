name: Platform Test

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to test'
        required: true
        type: string
      test-app-dir:
        description: 'Path to the test app directory'
        required: true
        type: string
      deployment-artifact-name:
        description: 'Name of the artifact containing the deployment URL'
        required: true
        type: string
      artifact-name:
        description: 'Name for failed test artifacts'
        required: true
        type: string

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    if: github.repository == 'sveltejs/kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.deployment-artifact-name }}
          path: ${{ runner.temp }}/deployment

      - name: Read deployment URL
        id: deployment
        run: echo "url=$(cat '${{ runner.temp }}/deployment/url')" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        working-directory: ${{ inputs.test-app-dir }}
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: pnpm test:platform

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.test-app-dir }}/test-results
          retention-days: 3
